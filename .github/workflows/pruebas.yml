name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    # ubuntu-latest pasó a 26.04 y Playwright 1.56 todavía no instala Chromium ahí: se fija la versión probada
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          npm ci
          pip install -r requirements-ci.txt

      - name: Sintaxis de JavaScript
        run: |
          for f in assets/js/*.js tools/*.mjs tools/e2e/*.cjs sw.js; do node --check "$f" || exit 1; done

      - name: Los archivos generados están al día
        # se vuelve a generar todo y se compara con lo que está en el repositorio, ignorando las fechas
        run: |
          node tools/build.mjs
          fallo=0
          for f in $(git diff --name-only); do
            if ! diff -q <(git show "HEAD:$f" | sed -E 's/20[0-9]{2}-[0-9]{2}-[0-9]{2}//g') <(sed -E 's/20[0-9]{2}-[0-9]{2}-[0-9]{2}//g' "$f") >/dev/null; then
              echo "::error file=$f::desactualizado: ejecuta node tools/build.mjs y sube el resultado"; fallo=1
            fi
          done
          nuevos=$(git ls-files --others --exclude-standard)
          if [ -n "$nuevos" ]; then echo "::error::archivos generados sin subir: $nuevos"; fallo=1; fi
          exit $fallo

      - name: Ejercicios y ejemplos (validador)
        run: node tools/validate.mjs

      - name: Repaso espaciado (FSRS)
        run: node tools/fsrs.mjs

      - name: Ejercicios SQL en DuckDB (el motor del curso)
        run: |
          npm install --no-save @duckdb/node-api@1.1.3-alpha.7
          node tools/duckdb.mjs

      - name: Prueba de humo en navegador
        run: |
          # axe-core (accesibilidad) va en la misma instalación: otro npm install --no-save quitaría Playwright
          npm install --no-save playwright@1.56.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node tools/humo.mjs http://localhost:8000/

      - name: Ejercicios corregidos en el navegador (DuckDB-WASM y Pyodide)
        run: |
          curl -s -o /dev/null http://localhost:8000/ || { python3 -m http.server 8000 >/dev/null 2>&1 & sleep 2; }
          node tools/ejercicios-navegador.mjs http://localhost:8000/

      - name: Diagramas en teléfono y escritorio
        run: |
          curl -s -o /dev/null http://localhost:8000/ || { python3 -m http.server 8000 >/dev/null 2>&1 & sleep 2; }
          node tools/diagramas.mjs http://localhost:8000/

      - name: Accesibilidad (axe-core, tema claro y oscuro)
        run: |
          curl -s -o /dev/null http://localhost:8000/ || { python3 -m http.server 8000 >/dev/null 2>&1 & sleep 2; }
          node tools/accesibilidad.mjs http://localhost:8000/

      - name: Proyectos de punta a punta (las siete guías, la persistencia y la copia de seguridad)
        # cada prueba hace lo que haría un estudiante con el código de las soluciones, corre los chequeos del revisor
        # de Jira, abre los candados y recarga la página: si un cambio rompe un proyecto, el PR no pasa
        run: |
          curl -s -o /dev/null http://localhost:8000/ || { python3 -m http.server 8000 >/dev/null 2>&1 & sleep 2; }
          node tools/proyectos.mjs http://localhost:8000/
