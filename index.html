  <title>Academia de Datos</title>
  <meta name="description" content="Curso gratuito e interactivo de ingeniería de datos desde cero: SQL (de básico a súper avanzado), Python, Spark, PySpark, Airflow, dbt, Databricks, Azure, AWS y Google Cloud, con 8 casos de negocio. Practica en el navegador con un editor profesional, una terminal con las CLIs de la nube y más de 200.000 filas de datos.">
